name: Release

# Every push to main checks scriptVersion in DevMapLauncher/Main.lua.
# If there's no release for that version yet, it zips the script and publishes one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 -oP 'scriptVersion\s*=\s*\K[0-9.]+' DevMapLauncher/Main.lua)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Zip the script
        if: steps.ver.outputs.exists == 'false'
        run: zip -r "DevMapLauncher-${{ steps.ver.outputs.tag }}.zip" DevMapLauncher README.md LICENSE
      - name: Publish the release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dev Map Launcher ${{ steps.ver.outputs.tag }}
          files: DevMapLauncher-*.zip
          body: |
            Boot Call of Duty dev and prototype builds on an Xbox 360 from the controller.

            **Install:** unzip, copy the `DevMapLauncher` folder to `Aurora\User\Scripts\Utility\` on the drive Aurora runs from, then restart Aurora. Open it from Back > Scripts > Utility Scripts > Dev Map Launcher.

            Needs the Xbdm plugin loaded through `launch.ini`, and Hayzen (or another loader) for devkit `.exe` files. See the README for details.
